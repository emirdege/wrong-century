name: Decide next episode

on:
  schedule:
    - cron: "45 12 * * *"   # 12:45 UTC = 15:45 Istanbul — oylar sayılır, üretim görevi bu karara göre çalışır
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-episode

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oy say
        env:
          MAKE_COMMENTS_HOOK: ${{ secrets.MAKE_COMMENTS_HOOK }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DECIDE_ONLY: "1"
        run: python scripts/publish.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "wrong-century-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)" && git push
