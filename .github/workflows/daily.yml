name: Daily episode

on:
  schedule:
    - cron: "0 16 * * *"   # her gün 16:00 UTC = 19:00 İstanbul / 11:00 New York
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece dene, yayınlama (1 = evet)"
        default: "1"

permissions:
  contents: write

concurrency: daily-episode

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oy say + yayınla
        env:
          MAKE_PUBLISH_HOOK: ${{ secrets.MAKE_PUBLISH_HOOK }}
          MAKE_COMMENTS_HOOK: ${{ secrets.MAKE_COMMENTS_HOOK }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/publish.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "wrong-century-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)" && git push
